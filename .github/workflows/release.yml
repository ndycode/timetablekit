name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish. Use a tag from a commit with this registry and workflow.
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.10.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH."
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Release tag was not found in the checkout."
            exit 1
          fi
          tag_commit=$(git rev-list -n 1 "$RELEASE_TAG")
          head_commit=$(git rev-parse HEAD)
          if [[ "$tag_commit" != "$head_commit" ]]; then
            echo "Release tag must point to the checked-out commit."
            exit 1
          fi
          package_version=$(node -p "require('./config/public-packages.json').version")
          if [[ "v$package_version" != "$RELEASE_TAG" ]]; then
            echo "Release tag does not match the public package registry version."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm validate
      - name: Pack public packages
        run: pnpm packages:pack:release
      - name: Publish public packages
        run: pnpm packages:publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "TimetableKit $RELEASE_TAG" --generate-notes
