name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish. The tag must already exist on the selected commit.
        required: true
        default: v0.1.0

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.10.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH."
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          tag_commit=$(git rev-list -n 1 "$RELEASE_TAG")
          head_commit=$(git rev-parse HEAD)
          if [[ "$tag_commit" != "$head_commit" ]]; then
            echo "Release tag must point to the checked-out commit."
            exit 1
          fi
          package_version=$(node -p "require('./packages/core/package.json').version")
          if [[ "v$package_version" != "$RELEASE_TAG" ]]; then
            echo "Release tag does not match the core package version."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm --filter @ndycode/timetablekit pack
      - run: pnpm --filter @ndycode/timetablekit-agent pack
      - name: Publish package
        run: pnpm --filter @ndycode/timetablekit publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish agent package
        run: pnpm --filter @ndycode/timetablekit-agent publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "TimetableKit $RELEASE_TAG" --generate-notes
